<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaShelf | Branch studio</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#main">
      <span class="brand-mark" aria-hidden="true">✚</span>
      PharmaShelf
    </a>

    <label class="theme-control">
      Theme
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="dim">Semi-dark</option>
        <option value="light">Light</option>
      </select>
    </label>
  </header>

  <main id="main">
    <header class="hero">
      <h1>Medicine <em>availability.</em></h1>
      <p>Check a medicine at your branch. Pharmacy owners can also review upcoming expiries and sales.</p>
    </header>

    <div class="workspace">
      <section class="card" aria-labelledby="chat-title">
        <h2 id="chat-title">Ask PharmaShelf</h2>
        <p class="intro">Include the medicine name and branch code in your question.</p>

        <div id="messages" role="log" aria-label="Conversation"></div>

        <form id="chat-form">
          <label for="question">Your question</label>
          <textarea id="question" rows="4" maxlength="2000" required
            placeholder="Is paracetamol available at DEMO-01?"></textarea>

          <div class="actions">
            <span id="chat-status" class="status" role="status"></span>
            <button type="submit">Send question <span aria-hidden="true">↗</span></button>
          </div>
        </form>
      </section>

      <section class="card owner-card" aria-labelledby="owner-title">
        <h2 id="owner-title">Owner reports</h2>
        <p class="intro">Sign in to view inventory and sales for a branch.</p>

        <form id="report-form">
          <label for="report-type">Report</label>
          <select id="report-type">
            <option value="expiry">Expiry risk · next 30 days</option>
            <option value="sales">Best sellers</option>
          </select>

          <label for="branch">Branch code</label>
          <input id="branch" value="DEMO-01" maxlength="40" required>

          <fieldset id="sales-fields" hidden disabled>
            <legend>Sales period</legend>
            <div class="date-grid">
              <label>From<input id="start-date" type="date" required></label>
              <label>To<input id="end-date" type="date" required></label>
            </div>

            <label for="rank">Rank by</label>
            <select id="rank">
              <option value="units">Units sold</option>
              <option value="revenue">Revenue (BDT)</option>
            </select>
          </fieldset>

          <label for="owner-email">Owner email</label>
          <input id="owner-email" type="email" autocomplete="username" required>

          <label for="owner-password">Password</label>
          <input id="owner-password" type="password"
                 autocomplete="current-password" required>

          <button class="report-button" type="submit">
            View report <span aria-hidden="true">→</span>
          </button>
        </form>

        <p id="report-status" class="status" role="status"></p>

        <div id="report-result" hidden>
          <h3 id="report-title"></h3>
          <ul id="report-rows"></ul>
        </div>
      </section>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaShelf | Medicine availability</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <strong class="brand">PharmaShelf</strong>
    <label class="theme-control">
      Theme
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="dim">Dim</option>
        <option value="light">Light</option>
      </select>
    </label>
  </header>

  <main>
    <h1>Check medicine availability</h1>
    <p class="intro">
      Enter a medicine name and branch code. To try the demo,
      ask “Is paracetamol available at DEMO-01?”
    </p>

    <section class="chat" aria-label="PharmaShelf assistant">
      <div id="messages" role="log" aria-live="polite"
           aria-label="Conversation"></div>

      <form id="chat-form">
        <label for="question">Your question</label>
        <textarea id="question" rows="3" maxlength="2000" required
          placeholder="Is paracetamol available at DEMO-01?"></textarea>
        <div class="actions">
          <span id="status" role="status"></span>
          <button id="send" type="submit">Send question</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
